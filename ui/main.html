<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Temponome</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/ui/deck.css">
<style>
/* "Stage of lamps": one lamp shade per light, filled and colored the way the bulb is right now,
   like the bars of an equalizer. Shapes come from the logo (a metronome-shaped table lamp).
   Rule: no caption may touch or cross a line. The window always fits; nothing scrolls. */
body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.top { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 24px 4px; }
.tempo { display: flex; align-items: baseline; gap: 8px; }
#bpmNum { font-size: 30px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
#lockTxt { font-size: 13px; color: var(--mut); }
.logo { width: 22px; height: 26px; flex: none; align-self: center; }

/* the stage: lamps share the width; each shade keeps its shape and grows with the window */
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; gap: clamp(10px, 3vw, 28px); padding: 6px 24px 0; }
.lamp { flex: 1 1 0; max-width: 150px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.lamp svg { flex: 1; min-height: 0; width: 100%; display: block; }
/* the fill is scaled up from the shade's bottom edge: a CSS transform animates in WebKit too */
.lamp .fill { transform-box: view-box; transform-origin: 50px 114px; transform: scaleY(0); transition: transform .08s linear, fill .12s linear; }
.lamp .name { max-width: 100%; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lamp .does { max-width: 100%; font-size: 12px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lamp.off .name { color: var(--mut); }
#empty { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
#empty p { margin: 0; font-size: 14px; }
.noLights #empty { display: flex; } .noLights .needsLights { display: none !important; }

/* controls: play, brightness, pulse, together/chase */
.controls { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 20px; padding: 14px 24px 12px; }
#play { width: 54px; height: 54px; padding: 0; border: 0; border-radius: 50%; background: var(--accent-fill); color: var(--on-accent);
  display: grid; place-items: center; flex: none; }
#play svg { width: 22px; height: 22px; }
.slider { flex: 1 1 130px; min-width: 120px; }
.slider .row { display: flex; justify-content: space-between; align-items: baseline; }
.slider .row span:last-child { font-size: 12px; color: var(--mut); }
.slider label { font-size: 12px; color: var(--cap); }
.fill-range { --v: 50%; }
input.fill-range::-webkit-slider-runnable-track { height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, var(--amber) var(--v), var(--amber-off) var(--v)); }
input.fill-range::-webkit-slider-thumb { margin-top: -6px; }

/* status strip */
.bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 7px 18px 9px 20px; border-top: 1px solid var(--line); background: var(--panel); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mut); flex: none; }
.dot.ok { background: var(--ok); } .dot.wait { background: var(--wait); } .dot.warn { background: var(--warn); } .dot.error { background: var(--err); }
#status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-height: 380px) { .lamp .does { display: none; } #bpmNum { font-size: 24px; } }
@media (prefers-reduced-motion: reduce) { .lamp .fill { transition: none; } }
</style></head>
<body>
<div class="titlebar pywebview-drag-region" aria-hidden="true"></div>
<header class="top">
 <div class="tempo" role="img" id="meter" aria-label="Tempo not running">
  <svg class="logo" viewBox="0 0 28 32" aria-hidden="true"><polygon points="3,26 25,26 19,3 9,3" fill="var(--cream)" stroke="var(--line)"/><line id="arm" x1="14" y1="25" x2="14" y2="6" stroke="#6b4f2a" stroke-width="2.5" stroke-linecap="round" style="transform-origin:14px 25px;transition:transform .12s"/><rect x="12" y="27" width="4" height="4" fill="#8e8e93"/></svg>
  <span id="bpmNum" aria-hidden="true">—</span><span id="lockTxt" aria-hidden="true">stopped</span>
 </div>
</header>

<main class="stage needsLights" id="lamps" aria-label="Your lights"></main>
<div id="empty"><p>Find your lights to get started</p><button id="findLights">Find my lights</button></div>

<section class="controls needsLights" aria-label="Controls">
 <button id="play" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
 <div class="slider">
  <div class="row"><label for="maxB">Brightness</label><span id="maxBv"></span></div>
  <input type="range" class="fill-range" id="maxB" min="10" max="100" step="10">
 </div>
 <div class="slider">
  <div class="row"><label for="smooth">Pulse</label><span id="smoothV"></span></div>
  <input type="range" class="fill-range" id="smooth" min="0" max="1" step="0.05">
 </div>
 <div class="seg" role="radiogroup" aria-label="How beat lights share the beats" id="multiBox">
  <button role="radio" id="mSync" aria-checked="true" title="All lights on the beat flash together">Together</button>
  <button role="radio" id="mChase" aria-checked="false" title="Lights on the beat take turns, one per beat">Chase</button>
 </div>
</section>

<footer class="bar">
 <span class="dot" id="dot"></span>
 <span id="status" role="status" aria-live="polite">Ready · press Play</span>
 <button id="settings" aria-label="Settings" title="Settings (⌘,)">
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="vertical-align:-3px"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7.4-3a7.4 7.4 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-2-1.2L14.5 3h-4l-.4 2.6a7.4 7.4 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7.4 7.4 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>
  Settings</button>
</footer>

<script src="/ui/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const DOES = { beat: 'On the beat', kick: 'Kick drum', snare: 'Snare', hats: 'Hi-hats',
               low: 'Bass bar', mid: 'Middle bar', high: 'Treble bar', pitch: 'Pitch to color' };
// the lamp shade from the logo; the colored part rises from the bottom with the bulb's brightness
const SHADE = '8,114 92,114 70,8 30,8', TOP = 8, BOT = 114;
let st = null, lastBeats = null, loaded = false, multiTouched = 0, saveFailedAt = 0, tick = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)');

function lampList() {
  const devs = st.cfg.devices.filter(d => d.ip);
  if (st.running && st.lamps && st.lamps.length) return st.lamps;
  return devs.map(d => ({ name: d.name || d.ip, b: 0, hex: null, ok: true, sound: d.sound || 'beat' }));
}
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function makeLamp(i) {
  const box = document.createElement('div'); box.className = 'lamp';
  const svg = el('svg', { viewBox: '0 0 100 124', preserveAspectRatio: 'xMidYMax meet', 'aria-hidden': 'true' }, box);
  const clip = el('clipPath', { id: 'shade' + i }, el('defs', {}, svg));
  el('polygon', { points: SHADE }, clip);
  el('polygon', { points: SHADE, fill: 'var(--shade-off)' }, svg);
  // the clip sits on a group, so scaling the colored rect inside it keeps the shade's shape
  el('rect', { class: 'fill', x: 0, width: 100, y: TOP, height: BOT - TOP }, el('g', { 'clip-path': `url(#shade${i})` }, svg));
  el('ellipse', { class: 'glow', cx: 50, cy: 119, rx: 44, ry: 4, opacity: 0 }, svg);
  const name = document.createElement('span'); name.className = 'name';
  const does = document.createElement('span'); does.className = 'does';
  box.append(name, does);
  return box;
}
function renderLamps() {
  const box = $('lamps'), list = lampList();
  if (box.children.length !== list.length) {
    box.innerHTML = '';
    list.forEach((_, i) => box.appendChild(makeLamp(i)));
  }
  list.forEach((l, i) => {
    const e = box.children[i], lit = st.running && l.hex && l.ok;
    const lvl = lit ? Math.max(0.06, l.b / 100) : 0;
    const fill = e.querySelector('.fill'), glow = e.querySelector('.glow');
    fill.style.transform = `scaleY(${lvl.toFixed(3)})`;
    fill.setAttribute('fill', lit ? l.hex : 'transparent');
    glow.setAttribute('fill', lit ? l.hex : 'transparent'); glow.setAttribute('opacity', (lvl * 0.45).toFixed(2));
    e.querySelector('.name').textContent = l.name;
    e.querySelector('.does').textContent = DOES[l.sound] || DOES.beat;
    e.classList.toggle('off', !lit);
    e.title = !l.ok ? `${l.name} isn't answering` : '';
  });
}

function render() {
  const running = st.running, devs = st.cfg.devices.filter(d => d.ip);
  document.body.classList.toggle('noLights', !devs.length);
  $('play').setAttribute('aria-label', running ? 'Stop' : 'Play');
  $('playIcon').setAttribute('d', running ? 'M6.5 6.5h11v11h-11z' : 'M8 5v14l11-7z');
  const bpm = running && st.bpm ? Math.round(st.bpm) : 0;
  $('bpmNum').textContent = bpm ? bpm + ' BPM' : '—';
  $('lockTxt').textContent = !running ? 'stopped' : st.locked ? 'on the beat' : 'finding the beat';
  $('meter').setAttribute('aria-label', bpm ? `Tempo ${bpm} BPM` : 'Tempo not running');
  // the logo's metronome arm ticks from side to side on each beat
  if (lastBeats !== null && st.beats !== lastBeats && running && !reduce.matches) tick = !tick;
  lastBeats = st.beats;
  $('arm').style.transform = running ? `rotate(${tick ? 18 : -18}deg)` : 'rotate(0deg)';
  renderLamps();

  const saveFailed = Date.now() - saveFailedAt < 4000;
  $('status').textContent = saveFailed ? "Couldn't save your last change. Try again." : st.status;
  $('status').title = st.error || '';
  $('dot').className = 'dot ' + (saveFailed ? 'warn' : st.status_level);
  // Together / Chase only matters for two or more lights that follow the beat
  const beatLights = devs.filter(d => (d.sound || 'beat') === 'beat').length;
  $('multiBox').hidden = beatLights < 2;
  if (Date.now() - multiTouched > 800) showMulti(st.cfg.multi === 'chase');
  if (!loaded) { $('maxB').value = st.cfg.maxB; $('smooth').value = st.cfg.smooth; loaded = true; }
  showSliders();
}
function showSliders() {
  const v = +$('maxB').value, sm = +$('smooth').value;
  $('maxBv').textContent = v + '%';
  $('maxB').setAttribute('aria-valuetext', v + ' percent');
  $('maxB').style.setProperty('--v', ((v - 10) / 90 * 100) + '%');
  const word = sm < 0.34 ? 'snappy' : sm > 0.66 ? 'smooth' : 'medium';
  $('smoothV').textContent = word;
  $('smooth').setAttribute('aria-valuetext', word);
  $('smooth').style.setProperty('--v', (sm * 100) + '%');
}
function showMulti(chase) {
  $('mSync').setAttribute('aria-checked', !chase); $('mChase').setAttribute('aria-checked', chase);
  $('mSync').tabIndex = chase ? -1 : 0; $('mChase').tabIndex = chase ? 0 : -1;
}
function setMulti(chase) {
  multiTouched = Date.now(); showMulti(chase);
  T.saveCfg({ multi: chase ? 'chase' : 'sync' });
}

async function poll() {
  try { st = await T.api('/api/state'); render(); } catch (e) { /* server restarting */ }
}
async function togglePlay() {
  await T.api(st && st.running ? '/api/stop' : '/api/start', {});
  poll();
}

$('play').onclick = togglePlay;
$('maxB').oninput = () => { showSliders(); T.saveCfg({ maxB: +$('maxB').value }); };
$('smooth').oninput = () => { showSliders(); T.saveCfg({ smooth: +$('smooth').value }); };
$('mSync').onclick = () => setMulti(false);
$('mChase').onclick = () => setMulti(true);
$('multiBox').onkeydown = e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
    e.preventDefault(); const chase = $('mSync').getAttribute('aria-checked') === 'true';
    setMulti(chase); $(chase ? 'mChase' : 'mSync').focus();
  }
};
$('settings').onclick = () => T.openSettings();
$('findLights').onclick = () => T.openSettings('lights');
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !['BUTTON', 'INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) {
    e.preventDefault(); togglePlay();
  }
  if (e.key === ',' && e.metaKey) { e.preventDefault(); T.openSettings(); }
});
window.addEventListener('temponome-save-failed', () => { saveFailedAt = Date.now(); });
setInterval(poll, 100);
poll();
</script>
</body></html>
